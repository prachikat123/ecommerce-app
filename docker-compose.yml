# Optional: a PostgreSQL instance for production-parity testing.
#
# The app ships configured for SQLite so local development needs zero setup.
# Use this only when you want to run against the same database engine as
# production — see README "Going to production" for the provider switch.
#
#   docker compose up -d db
#   # then point server/.env at:
#   # DATABASE_URL="postgresql://krishi:krishi@localhost:5432/krishibazaar?schema=public"

services:
  db:
    image: postgres:16-alpine
    container_name: krishibazaar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishi
      POSTGRES_PASSWORD: krishi
      POSTGRES_DB: krishibazaar
    ports:
      - "5432:5432"
    volumes:
      - krishibazaar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi -d krishibazaar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  krishibazaar_pgdata:
